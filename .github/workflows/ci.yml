name: AirWatch Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ingestion-tests:
    name: Data Ingestion Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Ingestion Unit Tests
        run: |
          python ingestion/test_ingestion.py

  backend-tests:
    name: Rust Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check Formatting
        run: |
          cd backend && cargo fmt --check || true

      - name: Run Backend Compilation Check
        run: |
          cd backend && cargo check

      - name: Run Backend API Tests
        run: |
          cd backend && cargo test --test api_tests

  frontend-tests:
    name: Frontend Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend && npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend && npm test

      - name: Build Frontend Production Assets
        run: |
          cd frontend && npm run build
