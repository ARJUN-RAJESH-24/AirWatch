version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: airwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airwatch}
      POSTGRES_USER: ${POSTGRES_USER:-airwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airwatch_secure_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airwatch} -d ${POSTGRES_DB:-airwatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - airwatch-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airwatch-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-airwatch}:${POSTGRES_PASSWORD:-airwatch_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-airwatch}
      HOST: 0.0.0.0
      PORT: 3001
      CORS_ORIGIN: "*"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-airwatch-admin-secret-2026}
      RUST_LOG: "airwatch_backend=info,tower_http=info"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - airwatch-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airwatch-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - airwatch-network

  ingestion-worker:
    image: python:3.11-slim
    container_name: airwatch-ingestion-worker
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-airwatch}:${POSTGRES_PASSWORD:-airwatch_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-airwatch}
      DATAGOVIN_API_KEY: ${DATAGOVIN_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-airwatch-admin-secret-2026}
    volumes:
      - ./ingestion:/app/ingestion:ro
      - ./data:/app/data
    working_dir: /app
    command: >
      bash -c "pip install --no-cache-dir requests psycopg2-binary &&
               python -u ingestion/ingest.py --db postgres://${POSTGRES_USER:-airwatch}:${POSTGRES_PASSWORD:-airwatch_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-airwatch} --scope kerala"
    profiles:
      - worker
      - ingestion
    networks:
      - airwatch-network

volumes:
  pgdata:
    name: airwatch-pgdata

networks:
  airwatch-network:
    name: airwatch-network
    driver: bridge
