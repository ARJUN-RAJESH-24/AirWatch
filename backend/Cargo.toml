[package]
name = "airwatch-backend"
version = "0.1.0"
edition = "2021"
description = "AirWatch: Cloud-Native Environmental Data Analytics Platform using Official Indian Air Quality Data"
authors = ["AirWatch Engineering Team"]

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.37", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "any", "sqlite", "postgres", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy = "0.15"
csv = "1.3"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
http = "1.0"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
